<style>
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
body{font-family:'Nunito',-apple-system,BlinkMacSystemFont,'Segoe UI',sans-serif;background:#f5f7ff;min-height:100vh;}

.inp,.sel{width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid #e0e4ee;font-size:14px;outline:none;background:#fafbff;font-family:inherit;box-sizing:border-box;}
.textarea{width:100%;padding:10px 14px;border-radius:10px;border:1.5px solid #e0e4ee;font-size:14px;outline:none;background:#fafbff;font-family:inherit;box-sizing:border-box;resize:vertical;min-height:100px;}
.btn{border:none;border-radius:10px;padding:11px 22px;font-weight:700;font-size:14px;cursor:pointer;font-family:inherit;width:100%;}
.btn-green{background:#16a34a;color:#fff;}
.btn-red{background:#ef4444;color:#fff;}.btn-purple{background:#7c3aed;color:#fff;box-shadow:0 4px 12px #7c3aed33;}.btn-blue{background:#2563eb;color:#fff;box-shadow:0 4px 12px #2563eb33;}
.btn-outline{background:transparent;color:#16a34a;border:2px solid #16a34a;width:auto;}
.btn-sm{padding:7px 14px;font-size:12px;width:auto;}
.header{background:linear-gradient(135deg,#0a2e0f,#1a5c28);padding:16px 20px 54px;}
.pill{display:inline-block;border-radius:99px;padding:3px 10px;font-size:11px;font-weight:700;white-space:nowrap;}
.content{padding:0 16px 80px;margin-top:-34px;}
.g2{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:14px;}
.g3{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-bottom:14px;}
.tabs{display:flex;gap:6px;margin-bottom:14px;overflow-x:auto;padding-bottom:4px;}
.tab{padding:9px 14px;border-radius:10px;border:none;white-space:nowrap;font-weight:700;font-size:12px;cursor:pointer;flex-shrink:0;font-family:inherit;}
.hbtn{border:none;border-radius:14px;padding:18px 22px;font-family:inherit;font-weight:700;font-size:15px;cursor:pointer;text-align:left;display:flex;align-items:center;gap:14px;width:100%;margin-bottom:12px;}
.snbtn{width:100%;text-align:left;padding:14px 16px;border-radius:10px;border:1.5px solid #e0e4ee;background:#fff;font-family:inherit;font-size:14px;cursor:pointer;margin-bottom:8px;display:flex;align-items:center;justify-content:space-between;}
.addbox{background:#f8fafb;border-radius:10px;padding:12px;border:1px solid #e0e4ee;margin-top:8px;}
#fl{display:none;position:fixed;top:16px;left:50%;transform:translateX(-50%);z-index:9999;color:#fff;padding:10px 24px;border-radius:20px;font-weight:700;font-size:13px;box-shadow:0 4px 16px rgba(0,0,0,.3);}
#ov{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:9000;align-items:center;justify-content:center;padding:20px;}

<script>
firebase.initializeApp({

var db=firebase.database();
var TPASS="1234",PPASS="reforco2026";
var DAYS=["Segunda","Terca","Quarta","Quinta","Sexta","Sabado"];
var DLABELS=["Segunda","Ter\u00e7a","Quarta","Quinta","Sexta","S\u00e1bado"];
var GRADES=["9\u00ba Ano","1\u00ba Ano EM","2\u00ba Ano EM","3\u00ba Ano EM"];
var SUBS=["Matem\u00e1tica","Portugu\u00eas","Reda\u00e7\u00e3o","Hist\u00f3ria","Geografia","F\u00edsica","Qu\u00edmica","Biologia","Ingl\u00eas","Filosofia","Sociologia","Arte","Outro"];
var G="#16a34a",GD="#0a2e0f";
var S={screen:"home",student:null,weekStart:"",db:null,tab:"week",tTab:"alunos",tRT:"tema",sRT:"filmes",exp:null,editW:false,search:"",gf:"",sabExp:null,sabModo:"provas",atvExp:null,novaAtvAlunos:{},novaAtvOpen:false,histSem:null,rankOpen:false};
var _fl;

function today(){return new Date().toISOString().split("T")[0];}
function fmtS(s){return s?new Date(s+"T12:00:00").toLocaleDateString("pt-BR",{day:"2-digit",month:"2-digit"}):""}
function fmtL(s){return s?new Date(s+"T12:00:00").toLocaleDateString("pt-BR",{weekday:"long",day:"2-digit",month:"long"}):""}
function dl(s){return Math.ceil((new Date(s+"T12:00:00")-new Date())/86400000);}
function mkId(n){return n.toLowerCase().replace(/\s+/g,"_").replace(/[^a-z0-9_]/g,"");}
function pill(t,c){return "<span class='pill' style='background:"+c+"20;color:"+c+";border:1px solid "+c+"40'>"+t+"</span>";}
function wkDates(s){if(!s)return["","","","","",""];var o=[];for(var i=0;i<6;i++){var d=new Date(s+"T12:00:00");d.setDate(d.getDate()+i);o.push(d.toISOString().split("T")[0]);}return o;}

function dbLoad(){return new Promise(function(res){db.ref("reforco").once("value",function(s){res(s.val()||{students:{},weekStart:today(),redacao:{filmes:[],dicas:[],tema:{}},notificacoes:[]});},function(){res({students:{},weekStart:today(),redacao:{filmes:[],dicas:[],tema:{}},notificacoes:[]});});});}
function dbSet(p,v){return db.ref("reforco/"+p).set(v);}
function dbSaveSt(id,d){return dbSet("students/"+id,d);}

function showFlash(msg,color){var el=document.getElementById("fl");el.textContent=msg;el.style.background=color||G;el.style.display="block";clearTimeout(_fl);_fl=setTimeout(function(){el.style.display="none";},2000);}
function showModal(h){var el=document.getElementById("ov");el.innerHTML="<div style='background:#fff;border-radius:16px;padding:24px;width:100%;max-width:380px;max-height:80vh;overflow-y:auto'>"+h+"</div>";el.style.display="flex";el.onclick=function(e){if(e.target===el)closeModal();};}
function closeModal(){document.getElementById("ov").style.display="none";}
function go(s){S.screen=s;render();}
function set(u){for(var k in u)S[k]=u[k];render();}

// --- RENDER ---
function render(){
  var r=document.getElementById("root");
  if(S.screen==="home")r.innerHTML=renderHome();
  else if(S.screen==="sl")r.innerHTML=renderSL();
  else if(S.screen==="student")r.innerHTML=renderStudent();
  else if(S.screen==="pl")r.innerHTML=renderPL();
  else if(S.screen==="parent")r.innerHTML=renderParent();
  else if(S.screen==="tl")r.innerHTML=renderTL();
  else if(S.screen==="teacher")r.innerHTML=renderTeacher();
}

function q(s){return s.replace(/'/g,"&#39;").replace(/"/g,"&quot;");}

function renderHome(){
  return "<div style='min-height:100vh;background:linear-gradient(160deg,"+GD+",#1a5c28);display:flex;flex-direction:column;align-items:center;justify-content:center;padding:24px'>"+
  "<div style='text-align:center;margin-bottom:40px'><div style='font-size:56px;margin-bottom:8px'>&#127891;</div>"+
  "<div style='color:#fff;font-size:24px;font-weight:800'>Christian Lopes</div>"+
  "<div style='color:#86efac;font-size:11px;letter-spacing:4px;margin-top:6px'>ACOMPANHAMENTO DE ESTUDOS</div></div>"+
  "<div style='width:100%;max-width:340px'>"+
  "<button class='hbtn' onclick=\"go('sl')\" style='background:"+G+";color:#fff;box-shadow:0 6px 24px "+G+"55'><span style='font-size:26px'>&#127891;</span><div><div>Sou Aluno</div><div style='font-size:11px;font-weight:400;opacity:.8;margin-top:2px'>Registrar minha semana</div></div></button>"+
  "<button class='hbtn' onclick=\"go('pl')\" style='background:rgba(255,255,255,0.15);color:#fff;border:2px solid rgba(255,255,255,0.3)'><span style='font-size:26px'>&#128106;</span><div><div>Sou Respons&#225;vel</div><div style='font-size:11px;font-weight:400;opacity:.8;margin-top:2px'>Acompanhar meu filho</div></div></button>"+
  "<button class='hbtn' onclick=\"go('tl')\" style='background:rgba(255,255,255,0.08);color:#fff;border:2px solid rgba(255,255,255,0.15)'><span style='font-size:26px'>&#128104;&#8205;&#127979;</span><div><div>Sou Professor</div><div style='font-size:11px;font-weight:400;opacity:.8;margin-top:2px'>Painel de acompanhamento</div></div></button>"+
  "</div></div>";
}

function mkStudentList(students, fn){
  var html="";
  students.forEach(function(st){
    var id=q(st.id);
    html+="<button class='snbtn' onclick=\""+fn+"('"+id+"')\"><div><div style='font-weight:700;color:"+GD+"'>"+st.name+"</div><div style='font-size:11px;color:#888;margin-top:2px'>"+st.grade+"</div></div><span style='font-size:18px'>&#8594;</span></button>";
  });
  return html;
}

function renderSL(){
  var sts=S.db?Object.values(S.db.students||{}).sort(function(a,b){return a.name.localeCompare(b.name);}):[];
  var g=""; GRADES.forEach(function(g2){g+="<option value='"+g2+"'>"+g2+"</option>";});
  var html="<div style='min-height:100vh;background:#f5f7ff;padding:24px'>"+
  "<button onclick=\"go('home')\" style='background:none;border:none;font-size:22px;cursor:pointer;margin-bottom:20px;display:block'>&#8592;</button>"+
  "<div style='text-align:center;margin-bottom:28px'><div style='font-size:44px'>&#127891;</div><div style='font-size:20px;font-weight:800;color:"+GD+";margin-top:8px'>Entrar como Aluno</div></div>";
  if(sts.length>0){
    html+="<div class='card'><div style='font-size:12px;font-weight:700;color:#555;letter-spacing:1px;margin-bottom:12px'>SELECIONE SEU NOME:</div>"+mkStudentList(sts,"loginExisting")+"</div>";
    html+="<div style='text-align:center;color:#aaa;font-size:13px;margin:16px 0'>ou cadastre-se abaixo</div>";
  }

  "<input class='inp' id='sName' placeholder='Nome completo' style='margin-bottom:10px'>"+
  "<select class='sel' id='sGrade' style='margin-bottom:14px'><option value=''>Selecione sua s&#233;rie</option>"+g+"</select>"+
  "<button class='btn btn-green' onclick='sLogin()'>Entrar &#8594;</button></div></div>";
  return html;
}

function renderPL(){
  var sts=S.db?Object.values(S.db.students||{}).sort(function(a,b){return a.name.localeCompare(b.name);}):[];
  var html="<div style='min-height:100vh;background:#f5f7ff;padding:24px'>"+
  "<button onclick=\"go('home')\" style='background:none;border:none;font-size:22px;cursor:pointer;margin-bottom:20px;display:block'>&#8592;</button>"+
  "<div style='text-align:center;margin-bottom:20px'><div style='font-size:44px'>&#128106;</div><div style='font-size:20px;font-weight:800;color:"+GD+";margin-top:8px'>Acesso dos Respons&#225;veis</div></div>"+
  "<div class='card' style='margin-bottom:14px'><div style='font-size:12px;font-weight:700;color:#555;letter-spacing:1px;margin-bottom:8px'>SENHA DE ACESSO</div>"+
  "<input type='password' class='inp' id='pPass' placeholder='&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;&#9679;' style='margin-bottom:6px'>"+
  "<div id='pErr' style='color:#ef4444;font-size:12px;display:none'>&#10060; Senha incorreta.</div></div>"+

}

function renderStudent(){
  var st=S.student; if(!st) return "";
  var dates=wkDates(S.weekStart);
  var wl=dates[0]&&dates[5]?fmtS(dates[0])+" a "+fmtS(dates[5]):"Esta semana";
  var studied=0;
  DAYS.forEach(function(d){var x=st.week&&st.week[d];if(x&&x.subjects&&x.subjects.length)studied++;});
  var upcoming=(st.exams||[]).filter(function(e){return e.date>=today();}).sort(function(a,b){return a.date.localeCompare(b.date);});
  var notifs=(S.db&&S.db.notificacoes)||[];
  var an=null; for(var i=0;i<notifs.length;i++){if(notifs[i].ativa){an=notifs[i];break;}}
  var rd=S.db&&S.db.redacao?S.db.redacao:{filmes:[],dicas:[],tema:{}};

  // Week
  var wh="<div class='card'><div style='font-weight:700;font-size:14px;color:"+GD+";margin-bottom:2px'>&#128197; Semana de "+wl+"</div><div style='font-size:12px;color:#888;margin-bottom:18px'>Adicione mat&#233;rias e assuntos de cada dia:</div>";
  DAYS.forEach(function(day,di){
    var dl2=DLABELS[di]; var ds=dates[di]?" &#183; "+fmtS(dates[di]):"";
    var dd=(st.week&&st.week[day])||{subjects:[]}; var sb=dd.subjects||[];
    wh+="<div style='border-bottom:1px solid #f0f4f0;padding-bottom:16px;margin-bottom:16px'>";
    wh+="<div style='display:flex;align-items:center;justify-content:space-between;margin-bottom:10px'><span style='font-weight:700;font-size:13px;color:"+GD+"'>"+dl2+ds+"</span>";
    if(sb.length) wh+=pill(sb.length+" mat&#233;ria"+(sb.length>1?"s":""),G);
    wh+="</div>";
    sb.forEach(function(s,si){
      wh+="<div style='display:flex;align-items:center;gap:8px;margin-bottom:8px'>";
      wh+="<div style='flex:1;background:#f0fdf4;border-radius:8px;padding:8px 10px;border:1px solid #86efac'>";
      wh+="<div style='font-size:13px;font-weight:700;color:"+G+"'>"+s.subject+"</div>";
      if(s.topic) wh+="<div style='font-size:11px;color:#555;margin-top:2px'>&#128204; "+s.topic+"</div>";
      else wh+="<div style='font-size:11px;color:#f59e0b;margin-top:2px'>&#9888; Assunto n&#227;o informado</div>";
      wh+="</div><button onclick=\"removeSubject('"+day+"',"+si+")\" style='background:none;border:none;color:#ddd;cursor:pointer;font-size:18px;flex-shrink:0'>&#10005;</button></div>";
    });
    wh+="<div class='addbox'><div style='font-size:11px;font-weight:700;color:#888;letter-spacing:1px;margin-bottom:8px'>ADICIONAR MAT&#201;RIA:</div>";
    var sopts=""; SUBS.forEach(function(s){sopts+="<option value='"+s+"'>"+s+"</option>";});
    wh+="<select id='sel_"+day+"' class='sel' style='margin-bottom:8px'><option value=''>Selecione a mat&#233;ria</option>"+sopts+"</select>";
    wh+="<input id='top_"+day+"' class='inp' placeholder='Assunto (opcional): Ex: Fra&#231;&#245;es...' style='margin-bottom:8px'>";
    wh+="<button onclick=\"addSubjectDay('"+day+"')\" class='btn btn-green btn-sm'>+ Adicionar</button>";
    wh+="</div></div>";
  });
  wh+="</div>";

  // Exams
  var sopts2=""; SUBS.forEach(function(s){sopts2+="<option value='"+s+"'>"+s+"</option>";});
  var eh="<div class='card'><div style='font-weight:700;font-size:14px;color:"+GD+";margin-bottom:14px'>&#10133; Cadastrar Prova</div>"+
  "<select class='sel' id='eS' style='margin-bottom:10px'><option value=''>Disciplina</option>"+sopts2+"</select>"+
  "<input type='date' class='inp' id='eD' style='margin-bottom:10px'>"+
  "<input class='inp' id='eT' placeholder='Assunto da prova' style='margin-bottom:10px'>"+
  "<button class='btn btn-green btn-sm' onclick='addExam()'>Adicionar &#8594;</button></div>";
  if(!upcoming.length){eh+="<div class='card' style='text-align:center;padding:40px;color:#bbb'><div style='font-size:36px'>&#128491;</div><div style='margin-top:8px'>Nenhuma prova</div></div>";}
  else{upcoming.forEach(function(e){var d=dl(e.date),c=d<=3?"#ef4444":"#f59e0b",t=d<=0?"Hoje!":d===1?"Amanh&#227;":d+" dias";
    eh+="<div class='card' style='border-left:4px solid "+c+"'><div style='display:flex;justify-content:space-between;align-items:flex-start'><div><div style='font-weight:700;font-size:15px;color:"+GD+"'>"+e.subject+"</div>"+(e.topic?"<div style='font-size:13px;color:#555;margin-top:2px'>"+e.topic+"</div>":"")+"<div style='font-size:12px;color:#888;margin-top:6px'>&#128197; "+fmtL(e.date)+"</div></div><div style='display:flex;flex-direction:column;align-items:flex-end;gap:8px'>"+pill(t,c)+"<button onclick='delExam("+e.id+")' style='background:none;border:none;color:#ddd;cursor:pointer;font-size:16px'>&#128465;</button></div></div></div>";
  });}

  // Redacao
  var filmes=rd.filmes||[],dicas=rd.dicas||[],tema=rd.tema||{},mr=st.redacao||{};
  var fh=filmes.length?"":"<div class='card' style='text-align:center;padding:40px;color:#bbb'><div style='font-size:36px'>&#127916;</div><div style='margin-top:8px'>Nenhum filme ainda</div></div>";
  filmes.forEach(function(f){fh+="<div class='card' style='padding:0;overflow:hidden'>"+(f.img?"<img src='"+f.img+"' style='width:100%;height:150px;object-fit:cover'>":"<div style='width:100%;height:80px;background:#f0fdf4;display:flex;align-items:center;justify-content:center;font-size:40px'>&#127916;</div>")+"<div style='padding:14px'><div style='font-weight:700;font-size:15px;color:"+GD+"'>"+f.titulo+"</div>"+(f.genero?"<div style='font-size:12px;color:"+G+";margin-top:4px;font-weight:600'>"+f.genero+"</div>":"")+(f.descricao?"<div style='font-size:13px;color:#555;margin-top:8px;line-height:1.6'>"+f.descricao+"</div>":"")+(f.repertorio?"<div style='margin-top:10px;background:#f0fdf4;border-radius:8px;padding:10px;font-size:12px;color:#166534'><b>&#128161; Como usar:</b><br>"+f.repertorio+"</div>":"")+"</div></div>";});
  var dh=dicas.length?"":"<div class='card' style='text-align:center;padding:40px;color:#bbb'><div style='font-size:36px'>&#128161;</div><div style='margin-top:8px'>Nenhuma dica ainda</div></div>";
  dicas.forEach(function(d){dh+="<div class='card' style='border-left:4px solid #f59e0b'><div style='font-weight:700;font-size:14px;color:"+GD+";margin-bottom:8px'>"+d.titulo+"</div><div style='font-size:13px;color:#555;line-height:1.7'>"+d.conteudo+"</div></div>";});
  var topts=""; ["Dissertativo-Argumentativo","Narrativo","Descritivo","Expositivo"].forEach(function(t){topts+="<option value='"+t+"'"+(mr.tipo===t?" selected":"")+">"+t+"</option>";});
  var mh="";
  if(tema.titulo)mh+="<div class='card' style='border-left:4px solid "+G+";background:#f0fdf4;margin-bottom:12px'><div style='font-size:11px;font-weight:700;color:"+G+";letter-spacing:2px;margin-bottom:6px'>TEMA DA SEMANA</div><div style='font-weight:800;font-size:17px;color:"+GD+"'>"+tema.titulo+"</div>"+(tema.tipo?"<div style='margin-top:6px'>"+pill(tema.tipo,G)+"</div>":"")+(tema.contexto?"<div style='font-size:13px;color:#555;margin-top:8px;line-height:1.6'>"+tema.contexto+"</div>":"")+"</div>";
  if(mr.correcao)mh+="<div class='card' style='border-left:4px solid #3b82f6;background:#eff6ff;margin-bottom:12px'><div style='font-size:11px;font-weight:700;color:#3b82f6;letter-spacing:2px;margin-bottom:6px'>&#9999; CORRE&#199;&#195;O DO PROFESSOR</div><div style='font-size:13px;color:#1e40af;line-height:1.7;white-space:pre-wrap'>"+mr.correcao+"</div></div>";
  mh+="<div class='card'><div style='font-weight:700;font-size:14px;color:"+GD+";margin-bottom:14px'>&#9997; Minha Reda&#231;&#227;o</div><select class='sel' id='rTipo' style='margin-bottom:10px'><option value=''>Tipo de texto</option>"+topts+"</select><textarea class='textarea' id='rTexto' placeholder='Digite sua reda&#231;&#227;o...' style='margin-bottom:10px'>"+(mr.texto||"")+"</textarea><div style='font-size:11px;font-weight:700;color:#666;letter-spacing:1px;margin-bottom:6px'>OU ENVIE FOTO</div><input type='file' id='rFoto' accept='image/*' onchange='uploadFoto()' style='margin-bottom:10px;font-size:13px'>"+(mr.foto?"<img src='"+mr.foto+"' style='width:100%;max-height:250px;object-fit:contain;border-radius:8px;margin-bottom:10px'>":"")+"<button class='btn btn-green' onclick='saveRedacao()'>&#128190; Salvar Reda&#231;&#227;o</button></div>";
  var rtc=S.sRT==="filmes"?fh:S.sRT==="dicas"?dh:mh;
  var rh="<div class='tabs' style='margin-bottom:14px'>";
  [["filmes","&#127916; Filmes"],["dicas","&#128161; Dicas"],["minha","&#9997; Minha Reda&#231;&#227;o"]].forEach(function(x){rh+="<button class='tab' onclick=\"set({sRT:'"+x[0]+"'})\" style='background:"+(S.sRT===x[0]?GD:"#fff")+";color:"+(S.sRT===x[0]?"#fff":"#555")+"'>"+x[1]+"</button>";});

function criarAtvSimple(chKey){
  var titulo=document.getElementById('at_titulo_'+chKey);
  var enunc=document.getElementById('at_enunc_'+chKey);
  if(!titulo||!titulo.value.trim()){showFlash('Digite o título!','#ef4444');return;}
  if(!enunc||!enunc.value.trim()){showFlash('Digite o enunciado!','#ef4444');return;}
  // Buscar alunos do grupo direto do Firebase para garantir dados atualizados
  dbLoad().then(function(data){
    var materia="",assunto="";
    var alunosAlvo={};
    Object.values(data.students||{}).forEach(function(st){
      (st.exams||[]).filter(function(e){return e.date>=today();}).forEach(function(e){
        var ch=e.subject+(e.topic?"|"+e.topic:"");
        if(encodeChave(ch)===chKey){materia=e.subject;assunto=e.topic||"";alunosAlvo[st.id]=true;}

        var x=st.week&&st.week[day];

          var ch=s.subject+(s.topic?"|"+s.topic:"");

    });
    if(!Object.keys(alunosAlvo).length){showFlash('Nenhum aluno encontrado para este assunto!','#ef4444');return;}
    var links=_linksBuf[chKey]||[];
    var atv={

      enunciado:enunc.value.trim(),
      materia:materia,
      assunto:assunto,

      links:links,
      criada:today(),
      alunosAlvo:alunosAlvo,
      respostas:{}

    dbSet('atividades/'+chKey,atv).then(function(){
      dbLoad().then(function(d){S.db=d;_linksBuf[chKey]=[];showFlash('Atividade criada! Só os alunos do grupo vão ver ♥');render();});

var _respFotoBuf={};
function uploadRespFoto(ak){
  var file=document.getElementById('rfoto_'+ak).files[0];
  if(!file)return;
  showFlash('Comprimindo foto...','#f59e0b');
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var maxW=1200,maxH=1600;
      var w=img.width,h=img.height;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      if(h>maxH){w=Math.round(w*maxH/h);h=maxH;}
      var canvas=document.createElement('canvas');
      canvas.width=w;canvas.height=h;
      canvas.getContext('2d').drawImage(img,0,0,w,h);
      _respFotoBuf[ak]=canvas.toDataURL('image/jpeg',0.75);
      showFlash('Foto pronta! Clique em Enviar. ♥');
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function addSubjectDay(day){
  var sel=document.getElementById("sel_"+day);
  var ti=document.getElementById("top_"+day);
  var subject=sel?sel.value:"";
  var topic=ti?ti.value:"";
  if(!subject){showFlash("Selecione a mat\u00e9ria!","#ef4444");return;}
  var st=S.student;
  var d=(st.week&&st.week[day])||{subjects:[]};
  var subs=(d.subjects||[]).slice();
  subs.push({subject:subject,topic:topic});
  if(!st.week)st.week={};
  st.week[day]={subjects:subs};
  dbSaveSt(st.id,st).then(function(){showFlash("+ "+subject+" adicionado!");S.student=st;render();});
}

function removeSubject(day,si){
  var st=S.student;
  var d=(st.week&&st.week[day])||{subjects:[]};
  var subs=(d.subjects||[]).slice();subs.splice(si,1);
  if(!st.week)st.week={};st.week[day]={subjects:subs};
  dbSaveSt(st.id,st).then(function(){S.student=st;render();});
}

  var date=document.getElementById("eD").value;
  var topic=document.getElementById("eT").value||"";
  if(!subject||!date){showFlash("Selecione disciplina e data!","#ef4444");return;}
  var st=S.student;
  if(!st.exams)st.exams=[];
  st.exams.push({subject:subject,date:date,topic:topic,id:Date.now()});
  dbSaveSt(st.id,st).then(function(){showFlash("Prova adicionada!");S.student=st;render();});
}

function delExam(id){
  var st=S.student;
  st.exams=(st.exams||[]).filter(function(e){return e.id!==id;});
  dbSaveSt(st.id,st).then(function(){S.student=st;render();});
}

function saveRedacao(){
  var st=S.student;
  if(!st.redacao)st.redacao={};
  st.redacao.texto=document.getElementById("rTexto").value||"";
  st.redacao.tipo=document.getElementById("rTipo").value||"";
  dbSaveSt(st.id,st).then(function(){
    S.student=st;
    dbLoad().then(function(data){S.db=data;showFlash("Sua redação foi enviada! O professor já pode ver ♥");render();});
  });
}

function uploadFoto(){
  var file=document.getElementById("rFoto").files[0];
  if(!file)return;
  showFlash("Comprimindo foto...","#f59e0b");
  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var maxW=1200,maxH=1600;
      var w=img.width,h=img.height;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}
      if(h>maxH){w=Math.round(w*maxH/h);h=maxH;}
      var canvas=document.createElement("canvas");
      canvas.width=w;canvas.height=h;
      var ctx=canvas.getContext("2d");
      ctx.drawImage(img,0,0,w,h);
      var compressed=canvas.toDataURL("image/jpeg",0.75);
      var st=S.student;if(!st.redacao)st.redacao={};
      st.redacao.foto=compressed;
      dbSaveSt(st.id,st).then(function(){
        S.student=st;
        dbLoad().then(function(data){S.db=data;showFlash("Foto enviada! ♥");render();});
      });
    };
    img.src=e.target.result;
  };
  reader.readAsDataURL(file);
}

function tLogin(){
  var pass=document.getElementById("tPass").value;
  if(pass===TPASS){loadT();}else{document.getElementById("tErr").style.display="block";document.getElementById("tPass").value="";}
}

function loadT(){
  go("teacher");
  dbLoad().then(function(data){S.db=data;render();});
}

function saveWS(){
  var ws=document.getElementById("nw").value;if(!ws)return;
  dbSet("weekStart",ws).then(function(){dbLoad().then(function(data){S.db=data;S.editW=false;render();});});
}




function delHistorico(idx){
  if(!confirm('Apagar esta semana do histórico?'))return;
  dbLoad().then(function(data){
    var hist=data.historico||[];
    hist.splice(idx,1);
    db.ref('reforco/historico').set(hist).then(function(){
      dbLoad().then(function(d){S.db=d;showFlash('Semana removida!','#ef4444');render();});
    });
  });
}

function calcRanking(sts){
  var rank=[];
  sts.forEach(function(st){
    var pts=0;
    DAYS.forEach(function(d){
      var x=st.week&&st.week[d];
      if(x&&x.subjects&&x.subjects.length)pts+=x.subjects.length;
    });
    if(st.redacao&&(st.redacao.texto||st.redacao.foto))pts+=3;
    rank.push({nome:st.name,grade:st.grade,pts:pts,id:st.id});
  });
  return rank.sort(function(a,b){return b.pts-a.pts;});
}

function addNotifAuto(msg){
  dbLoad().then(function(data){
    var notifs=data.notificacoes||[];
    notifs.unshift({id:Date.now(),msg:msg,ativa:true,lidas:{},data:today()});
    if(notifs.length>20)notifs=notifs.slice(0,20);
    db.ref('reforco/notificacoes').set(notifs).then(function(){
      dbLoad().then(function(d){S.db=d;render();});
    });
  });
}

function resetW(){
  if(!confirm("Reiniciar semana de todos?\n\nOs estudos desta semana ser\u00e3o salvos no hist\u00f3rico antes de limpar."))return;
  dbLoad().then(function(data){
    // Salvar histórico da semana atual
    var hist=data.historico||[];
    var semData={semana:data.weekStart||today(),data:today(),alunos:{}};
    Object.keys(data.students||{}).forEach(function(id){
      var st=data.students[id];
      var dias=0;DAYS.forEach(function(d){if(st.week&&st.week[d]&&st.week[d].subjects&&st.week[d].subjects.length)dias++;});
      semData.alunos[id]={nome:st.name,grade:st.grade,dias:dias};
    });
    hist.unshift(semData);
    if(hist.length>12)hist=hist.slice(0,12); // guardar até 12 semanas
    db.ref('reforco/historico').set(hist);
    // Limpar semana
    Object.keys(data.students||{}).forEach(function(id){data.students[id].week={};});
    dbSet("students",data.students).then(function(){S.db=data;showFlash("Semana reiniciada! Histórico salvo ♥");render();});
  });
}

function editStudent(id){
  var data=S.db;if(!data)return;var st=data.students[id];
  var opts=GRADES.map(function(g){return "<option value='"+g+"'"+(st.grade===g?" selected":"")+">"+g+"</option>";}).join("");
  showModal("<div><div style='font-weight:700;font-size:16px;color:#0a2e0f;margin-bottom:14px'>&#9999; Editar Aluno</div><input class='inp' id='editName' value='"+st.name+"' style='margin-bottom:10px'><select class='sel' id='editGrade' style='margin-bottom:14px'>"+opts+"</select><div style='display:flex;gap:10px'><button class='btn btn-green' onclick='confirmEdit(\""+id+"\")'>Salvar</button><button class='btn' style='background:#f0f0f0;color:#555;border:none' onclick='closeModal()'>Cancelar</button></div></div>");
}

function confirmEdit(id){
  var name=document.getElementById("editName").value.trim();
  var grade=document.getElementById("editGrade").value;
  if(!name||!grade)return;closeModal();
  dbLoad().then(function(data){
    data.students[id].name=name;data.students[id].grade=grade;
    dbSaveSt(id,data.students[id]).then(function(){S.db=data;showFlash("Aluno atualizado!");render();});
  });
}

function deleteStudent(id){
  var data=S.db;if(!data)return;var st=data.students[id];
  if(!confirm("Excluir "+st.name+"?\n\nTodos os dados ser\u00e3o apagados."))return;
  db.ref("reforco/students/"+id).remove().then(function(){dbLoad().then(function(d){S.db=d;S.exp=null;showFlash("Aluno exclu\u00eddo!","#ef4444");render();});});
}

function saveCorrecao(id){
  var texto=document.getElementById("corr_"+id).value||"";
  dbLoad().then(function(data){
    if(!data.students[id].redacao)data.students[id].redacao={};
    data.students[id].redacao.correcao=texto;
    dbSaveSt(id,data.students[id]).then(function(){S.db=data;showFlash("Corre\u00e7\u00e3o enviada!");render();});
  });
}

function sendNotif(){
  var titulo=document.getElementById("nTitulo").value.trim();
  var msg=document.getElementById("nMensagem").value.trim();
  if(!titulo||!msg){showFlash("Preencha t\u00edtulo e mensagem!","#ef4444");return;}
  dbLoad().then(function(data){
    var notifs=(data.notificacoes||[]).slice();
    notifs.forEach(function(n){n.ativa=false;});
    notifs.unshift({titulo:titulo,mensagem:msg,ativa:true,data:new Date().toLocaleDateString("pt-BR")});
    dbSet("notificacoes",notifs).then(function(){S.db=data;S.db.notificacoes=notifs;showFlash("Aviso enviado!");render();});
  });
}

function toggleNotif(i){
  dbLoad().then(function(data){
    var notifs=(data.notificacoes||[]).slice();
    notifs.forEach(function(n,j){n.ativa=(j===i)?!n.ativa:false;});
    dbSet("notificacoes",notifs).then(function(){S.db=data;S.db.notificacoes=notifs;render();});
  });
}

function delNotif(i){
  dbLoad().then(function(data){
    var notifs=(data.notificacoes||[]).slice();notifs.splice(i,1);
    dbSet("notificacoes",notifs).then(function(){S.db=data;S.db.notificacoes=notifs;render();});
  });
}

function saveTema(){
  var titulo=document.getElementById("tTitulo").value||"";
  var tipo=document.getElementById("tTipo").value||"";
  var contexto=document.getElementById("tContexto").value||"";
  if(!titulo){showFlash("Digite o tema!","#ef4444");return;}
  dbLoad().then(function(data){
    if(!data.redacao)data.redacao={filmes:[],dicas:[],tema:{}};
    data.redacao.tema={titulo:titulo,tipo:tipo,contexto:contexto};
    dbSet("redacao",data.redacao).then(function(){S.db=data;addNotifAuto("📝 Novo tema de redação postado!");showFlash("Tema salvo!");render();});
  });
}

function addFilme(){
  var titulo=document.getElementById("fTitulo").value||"";
  var genero=document.getElementById("fGenero").value||"";
  var descricao=document.getElementById("fDesc").value||"";
  var rep=document.getElementById("fRep").value||"";
  var imgFile=document.getElementById("fImg").files[0];
  if(!titulo){showFlash("Digite o t\u00edtulo!","#ef4444");return;}
  function save(img){
    dbLoad().then(function(data){
      if(!data.redacao)data.redacao={filmes:[],dicas:[],tema:{}};
      if(!data.redacao.filmes)data.redacao.filmes=[];
      data.redacao.filmes.push({titulo:titulo,genero:genero,descricao:descricao,repertorio:rep,img:img,id:Date.now()});
      dbSet("redacao",data.redacao).then(function(){S.db=data;showFlash("Filme adicionado!");render();});
    });
  }
  if(imgFile){if(imgFile.size>800000){showFlash("Imagem muito grande!","#ef4444");return;}var r2=new FileReader();r2.onload=function(e){save(e.target.result);};r2.readAsDataURL(imgFile);}
  else save("");
}

function delFilme(i){
  if(!confirm("Remover este filme?"))return;
  dbLoad().then(function(data){data.redacao.filmes.splice(i,1);dbSet("redacao",data.redacao).then(function(){S.db=data;render();});});
}

function addDica(){
  var titulo=document.getElementById("dTitulo").value||"";
  var conteudo=document.getElementById("dConteudo").value||"";
  if(!titulo||!conteudo){showFlash("Preencha t\u00edtulo e conte\u00fado!","#ef4444");return;}
  dbLoad().then(function(data){
    if(!data.redacao)data.redacao={filmes:[],dicas:[],tema:{}};
    if(!data.redacao.dicas)data.redacao.dicas=[];
    data.redacao.dicas.push({titulo:titulo,conteudo:conteudo,id:Date.now()});
    dbSet("redacao",data.redacao).then(function(){S.db=data;showFlash("Dica adicionada!");render();});
  });
}

function delDica(i){
  if(!confirm("Remover esta dica?"))return;
  dbLoad().then(function(data){data.redacao.dicas.splice(i,1);dbSet("redacao",data.redacao).then(function(){S.db=data;render();});});
}

init();
</script>
