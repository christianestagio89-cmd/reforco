  "</div></div>";

}

function renderRedacaoAluno(st){
  var redList=st.redacoes||[];
  var rd=S.db&&S.db.redacao?S.db.redacao:{filmes:[],dicas:[],tema:{},temas:[]};
  var filmes=rd.filmes||[],dicas=rd.dicas||[],tema=rd.tema||{};
  var temasAtivos=rd.temas&&rd.temas.length>0?rd.temas:(tema&&tema.titulo?[{titulo:tema.titulo,tipo:tema.tipo||"",contexto:tema.contexto||""}]:[]);

  var fh=filmes.length?"":"<div class='card' style='text-align:center;padding:40px;color:#bbb'><div style='font-size:36px'>&#127916;</div><div style='margin-top:8px'>Nenhum filme ainda</div></div>";
  filmes.forEach(function(f){fh+="<div class='card' style='padding:0;overflow:hidden'>"+(f.img?"<img src='"+f.img+"' style='width:100%;height:150px;object-fit:cover'>":"<div style='width:100%;height:80px;background:#f0fdf4;display:flex;align-items:center;justify-content:center;font-size:40px'>&#127916;</div>")+"<div style='padding:14px'><div style='font-weight:700;font-size:15px;color:"+GD+"'>"+f.titulo+"</div>"+(f.genero?"<div style='font-size:12px;color:"+G+";margin-top:4px;font-weight:600'>"+f.genero+"</div>":"")+(f.descricao?"<div style='font-size:13px;color:#555;margin-top:8px;line-height:1.6'>"+f.descricao+"</div>":"")+(f.repertorio?"<div style='margin-top:10px;background:#f0fdf4;border-radius:8px;padding:10px;font-size:12px;color:#166534'><b>&#128161; Como usar:</b><br>"+f.repertorio+"</div>":"")+"</div></div>";});

  var dh=dicas.length?"":"<div class='card' style='text-align:center;padding:40px;color:#bbb'><div style='font-size:36px'>&#128161;</div><div style='margin-top:8px'>Nenhuma dica ainda</div></div>";
  dicas.forEach(function(d){dh+="<div class='card' style='border-left:4px solid #f59e0b'><div style='font-weight:700;font-size:14px;color:"+GD+";margin-bottom:8px'>"+d.titulo+"</div><div style='font-size:13px;color:#555;line-height:1.7'>"+d.conteudo+"</div></div>";});

  var topts=""; ["Dissertativo-Argumentativo","Narrativo","Descritivo","Expositivo"].forEach(function(t){topts+="<option value='"+t+"'>"+t+"</option>";});
  var mh="";

  // Temas ativos
  temasAtivos.forEach(function(t){
    mh+="<div class='card' style='border-left:4px solid "+G+";background:#f0fdf4;margin-bottom:12px'><div style='font-size:11px;font-weight:700;color:"+G+";letter-spacing:2px;margin-bottom:6px'>TEMA DA SEMANA</div><div style='font-weight:800;font-size:17px;color:"+GD+"'>"+t.titulo+"</div>"+(t.tipo?"<div style='margin-top:6px'>"+pill(t.tipo,G)+"</div>":"")+(t.contexto?"<div style='font-size:13px;color:#555;margin-top:8px;line-height:1.6'>"+t.contexto+"</div>":"")+"</div>";
  });

  mh+="<div class='card' style='border:2px solid "+G+";margin-bottom:16px'>";
  mh+="<div style='font-weight:800;font-size:14px;color:"+GD+";margin-bottom:14px'>&#9997; Enviar Nova Redação</div>";
  mh+="<select class='sel' id='rTipo' style='margin-bottom:10px'><option value=''>Tipo de texto</option>"+topts+"</select>";
  mh+="<textarea class='textarea' id='rTexto' placeholder='Digite sua redação aqui...' style='margin-bottom:10px;min-height:140px'></textarea>";
  mh+="<div style='font-size:11px;font-weight:700;color:#666;letter-spacing:1px;margin-bottom:6px'>OU ANEXE UMA FOTO:</div>";
  mh+="<input type='file' id='rFoto' accept='image/*' onchange='uploadFoto()' style='margin-bottom:12px;font-size:13px'>";
  mh+="<div id='fotoPreview'></div>";
  mh+="<button class='btn btn-green' onclick='saveRedacao()'>&#128190; Enviar Redação</button>";
  mh+="</div>";

  if(redList.length){
    mh+="<div style='font-size:11px;font-weight:800;color:#555;letter-spacing:1.5px;margin-bottom:10px'>MINHAS REDAÇÕES ANTERIORES:</div>";
    var sorted=redList.slice().sort(function(a,b){return (b.data||"").localeCompare(a.data||"");});
    sorted.forEach(function(red,idx){
      var isOpen=S.redExpAluno===red.id;
      var temCorr=red.correcao&&red.correcao.length>0;
      mh+="<div class='card' style='border-left:4px solid "+(temCorr?"#16a34a":"#f59e0b")+";margin-bottom:10px'>";
      mh+="<div style='cursor:pointer' onclick=\"set({redExpAluno:'"+(isOpen?"":red.id)+"'})\">";
      mh+="<div style='display:flex;justify-content:space-between;align-items:flex-start'>";
      mh+="<div style='flex:1'><div style='font-weight:800;font-size:13px;color:#1e1b4b'>Redação "+(sorted.length-idx)+(red.tipo?" · "+red.tipo:"")+"</div>";
      if(red.tema)mh+="<div style='font-size:11px;color:#16a34a;font-weight:700;margin-top:2px'>&#128203; "+red.tema+"</div>";
      mh+="<div style='font-size:11px;color:#888;margin-top:2px'>Enviada em "+fmtS(red.data||today())+"</div>";
      if(red.nota!==undefined&&red.nota!==null&&red.nota!=="")mh+="<div style='display:inline-block;background:linear-gradient(135deg,#7c3aed,#2563eb);color:#fff;border-radius:8px;padding:3px 10px;font-weight:900;font-size:13px;margin-top:4px'>"+red.nota+" / 1000</div>";
      mh+="</div>";
      var evolStr="";
      if(idx<sorted.length-1&&sorted[idx+1].nota!==undefined&&sorted[idx+1].nota!==""&&red.nota!==undefined&&red.nota!==""){
        var nA=parseInt(red.nota),nB=parseInt(sorted[idx+1].nota);
        if(!isNaN(nA)&&!isNaN(nB)){var df=nA-nB;evolStr=df>0?"<span style='color:#16a34a;font-weight:800;font-size:12px'>▲ +"+df+" pts</span>":df<0?"<span style='color:#ef4444;font-weight:800;font-size:12px'>▼ "+df+" pts</span>":"<span style='color:#888;font-size:12px'>= igual</span>";}
      }
      mh+="<div style='display:flex;flex-direction:column;align-items:flex-end;gap:4px'>"+evolStr;
      if(temCorr)mh+="<span class='pill' style='background:#dcfce7;color:#16a34a;border:1px solid #86efac'>&#10003; Corrigida</span>";
      else mh+="<span class='pill' style='background:#fef9c3;color:#b45309;border:1px solid #fde68a'>Aguardando</span>";
      mh+="<span style='color:#bbb;font-size:14px'>"+(isOpen?"&#9650;":"&#9660;")+"</span></div></div></div>";
      if(isOpen){
        mh+="<div style='margin-top:14px;padding-top:14px;border-top:1px solid #f0f4f0'>";
        if(red.foto)mh+="<img src='"+red.foto+"' style='width:100%;border-radius:10px;margin-bottom:12px;max-height:300px;object-fit:contain'>";

        }
        mh+="</div>";
      }
      mh+="</div>";
    });
  } else {
    mh+="<div class='card' style='text-align:center;padding:30px;color:#bbb'><div style='font-size:36px'>&#128221;</div><div style='margin-top:8px'>Você ainda não enviou nenhuma redação</div></div>";

  var rd=S.db&&S.db.redacao?S.db.redacao:{};
  var hist=rd.historicoTemas||[];
  var temaAtual=rd.tema||{};
  var html="<div style='background:linear-gradient(135deg,#0a2e0f,#16a34a);border-radius:16px;padding:18px;margin-bottom:16px;color:#fff'>";

  html+="<div style='font-weight:900;font-size:22px'>&#128203; Temas Trabalhados</div>";

function calcRanking(sts){
  var r=[];
  sts.forEach(function(st){var pts=0;DAYS.forEach(function(d){var x=st.week&&st.week[d];if(x&&x.subjects&&x.subjects.length)pts+=x.subjects.length;});r.push({nome:st.name,grade:st.grade,pts:pts,id:st.id});});
  return r.sort(function(a,b){return b.pts-a.pts;});
}

function calcRankingRedacao(sts){
  var r=[];
  sts.forEach(function(st){
    var melhor=null;
    (st.redacoes||[]).forEach(function(red){if(red.nota!==undefined&&red.nota!==null&&red.nota!==""){var n=parseInt(red.nota);if(!isNaN(n)&&(melhor===null||n>melhor))melhor=n;}});
    r.push({nome:st.name,grade:st.grade,melhorNota:melhor,id:st.id});
  });
  return r.sort(function(a,b){if(a.melhorNota===null&&b.melhorNota===null)return 0;if(a.melhorNota===null)return 1;if(b.melhorNota===null)return -1;return b.melhorNota-a.melhorNota;});
}

function uploadFoto(){

// ===== CANCELAR REDAÇÃO DO ALUNO (professor) =====
function cancelarRedAluno(stId,redId){
  if(!confirm('Cancelar esta redação? O aluno poderá enviar uma nova.'))return;
  dbLoad().then(function(data){
    var st=data.students[stId];
    if(!st||!st.redacoes){showFlash('Redação não encontrada!','#ef4444');return;}
    st.redacoes=st.redacoes.filter(function(r){return r.id!==redId;});
    dbSaveSt(stId,st).then(function(){S.db=data;showFlash('Redação cancelada! O aluno pode enviar novamente.','#f59e0b');render();});
  });
}

function salvarCorrecaoRed(stId,redId){
  var notaEl=document.getElementById('nota_'+stId+'_'+redId);var corrEl=document.getElementById('corr_'+stId+'_'+redId);
  if(!corrEl||!corrEl.value.trim()){showFlash('Escreva a correção!','#ef4444');return;}
  var nota=notaEl?notaEl.value:"";
  if(nota!==""&&(isNaN(parseInt(nota))||parseInt(nota)<0||parseInt(nota)>1000)){showFlash('Nota inválida! Use 0 a 1000.','#ef4444');return;}
  dbLoad().then(function(data){
    var st=data.students[stId];if(!st||!st.redacoes){showFlash('Redação não encontrada!','#ef4444');return;}
    var found=false;
    for(var i=0;i<st.redacoes.length;i++){
      if(st.redacoes[i].id===redId||((!st.redacoes[i].id)&&("red_"+i)===redId)){st.redacoes[i].correcao=corrEl.value.trim();st.redacoes[i].nota=nota!==""?parseInt(nota):"";found=true;break;}
    }
    if(!found){showFlash('Redação não encontrada!','#ef4444');return;}
    dbSaveSt(stId,st).then(function(){S.db=data;showFlash('Correção salva! ♥');render();});
  });
}

function uploadRespFoto(ak){
  var file=document.getElementById('rfoto_'+ak);if(!file||!file.files[0])return;

  if(f.size>10*1024*1024){showFlash('Foto muito grande! Use até 10MB.','#ef4444');return;}

  var reader=new FileReader();
  reader.onload=function(e){
    var img=new Image();
    img.onload=function(){
      var maxW=1400,maxH=1800,qual=0.80;
      if(f.size>5*1024*1024){maxW=1000;maxH=1200;qual=0.65;}
      else if(f.size>2*1024*1024){maxW=1200;maxH=1500;qual=0.72;}
      var w=img.width,h=img.height;
      if(w>maxW){h=Math.round(h*maxW/w);w=maxW;}if(h>maxH){w=Math.round(w*maxH/h);h=maxH;}
      var canvas=document.createElement('canvas');canvas.width=w;canvas.height=h;canvas.getContext('2d').drawImage(img,0,0,w,h);
      _atvFoto[ak]=canvas.toDataURL('image/jpeg',qual);
      // Atualiza preview diretamente no DOM, sem re-renderizar
      var prev=document.getElementById('prevAtv_'+ak);
      if(prev){prev.innerHTML="<img src='"+_atvFoto[ak]+"' style='width:100%;max-height:200px;object-fit:contain;border-radius:8px;border:2px solid #16a34a;margin-bottom:6px'><div style='font-size:12px;color:#16a34a;font-weight:700'>&#10003; Foto pronta! Clique em Enviar.</div>";}
      showFlash('Foto pronta!');
    };img.src=e.target.result;
  };reader.readAsDataURL(f);
}

    if(!data.redacao.temas)data.redacao.temas=[];
    if(!data.redacao.historicoTemas)data.redacao.historicoTemas=[];
    var jaAtivo=data.redacao.temas.some(function(t){return t.titulo===titulo;});
    if(jaAtivo){showFlash("Este tema já está na lista ativa!","#f59e0b");return;}
    var novoTema={id:'t_'+Date.now(),titulo:titulo,tipo:tipo,contexto:contexto,data:today()};
    data.redacao.temas.push(novoTema);
    data.redacao.tema={titulo:titulo,tipo:tipo,contexto:contexto};
    dbSet("redacao",data.redacao).then(function(){S.db=data;addNotifAuto("📝 Novo tema de redação postado!");showFlash("Tema adicionado!");render();});
  });
}

function removerTemaAtivo(tId){
  if(!confirm('Remover este tema da lista?'))return;
  dbLoad().then(function(data){
    if(data.redacao&&data.redacao.temas){
      // Guardar no histórico antes de remover
      var temRem=data.redacao.temas.find(function(t){return t.id===tId;});
      if(temRem){
        if(!data.redacao.historicoTemas)data.redacao.historicoTemas=[];
        var jaHist=data.redacao.historicoTemas.some(function(t){return t.titulo===temRem.titulo;});
        if(!jaHist)data.redacao.historicoTemas.push(Object.assign({},temRem));
      }
      data.redacao.temas=data.redacao.temas.filter(function(t){return t.id!==tId;});
      if(data.redacao.temas.length>0)data.redacao.tema=data.redacao.temas[data.redacao.temas.length-1];
      else data.redacao.tema={};
      dbSet('redacao',data.redacao).then(function(){S.db=data;showFlash('Tema removido e arquivado!','#f59e0b');render();});
    }
  });
}

window.tLogin=tLogin;window.go=go;window.sLogin=sLogin;window.loginExisting=loginExisting;window.loginParent=loginParent;

function init(){dbLoad().then(function(data){S.db=data;S.weekStart=data.weekStart||today();render();});}

function sLogin(){
  var name=document.getElementById("sName").value.trim();var grade=document.getElementById("sGrade").value;
  if(!name){showFlash("Digite seu nome!","#ef4444");return;}if(!grade){showFlash("Selecione sua série!","#ef4444");return;}
  var id=mkId(name);
  dbLoad().then(function(data){
    if(!data.students)data.students={};
    if(!data.students[id])data.students[id]={id:id,name:name,grade:grade,week:{},exams:[],redacoes:[]};
    if(data.students[id].redacao&&!data.students[id].redacoes){var old=data.students[id].redacao;data.students[id].redacoes=(old.texto||old.foto)?[{id:genRedId(),data:today(),tipo:old.tipo||"",texto:old.texto||"",foto:old.foto||"",correcao:old.correcao||"",nota:""}]:[];}
    if(!data.students[id].redacoes)data.students[id].redacoes=[];
    dbSaveSt(id,data.students[id]).then(function(){S.student=data.students[id];S.weekStart=data.weekStart||today();S.db=data;go("student");});
  });
}

function loginExisting(id){
  dbLoad().then(function(data){
    var st=data.students&&data.students[id];if(!st){showFlash("Aluno não encontrado","#ef4444");return;}
    if(st.redacao&&!st.redacoes){var old=st.redacao;st.redacoes=(old.texto||old.foto)?[{id:genRedId(),data:today(),tipo:old.tipo||"",texto:old.texto||"",foto:old.foto||"",correcao:old.correcao||"",nota:""}]:[];dbSaveSt(id,st);}
    if(!st.redacoes)st.redacoes=[];
    S.student=st;S.weekStart=data.weekStart||today();S.db=data;go("student");
    var notifs=data.notificacoes||[],an=null;for(var i=0;i<notifs.length;i++){if(notifs[i].ativa){an=notifs[i];break;}}
    if(an){setTimeout(function(){showModal("<div style='text-align:center'><div style='font-size:36px;margin-bottom:12px'>&#128226;</div><div style='font-weight:800;font-size:18px;color:#0a2e0f;margin-bottom:8px'>"+(an.titulo||an.msg||'Aviso')+"</div><div style='font-size:14px;color:#555;line-height:1.6;margin-bottom:20px'>"+(an.mensagem||'')+"</div><button class='btn btn-green' onclick='closeModal()'>Entendi &#10003;</button></div>");},400);}
  });
}

function loginParent(id){
  var pass=document.getElementById("pPass").value;
  if(pass!==PPASS){document.getElementById("pErr").style.display="block";return;}
  dbLoad().then(function(data){
    var st=data.students&&data.students[id];if(!st){showFlash("Aluno não encontrado","#ef4444");return;}
    if(!st.redacoes)st.redacoes=[];S.student=st;S.weekStart=data.weekStart||today();S.db=data;go("parent");
  });
}

function addSubjectDay(day){
  var sel=document.getElementById("sel_"+day);var ti=document.getElementById("top_"+day);
  var subject=sel?sel.value:"";if(!subject){showFlash("Selecione a matéria!","#ef4444");return;}
  var st=S.student;var d=(st.week&&st.week[day])||{subjects:[]};var subs=(d.subjects||[]).slice();
  subs.push({subject:subject,topic:ti?ti.value:""});if(!st.week)st.week={};st.week[day]={subjects:subs};
  dbSaveSt(st.id,st).then(function(){showFlash("+ "+subject+" adicionado!");S.student=st;render();});
}

function removeSubject(day,si){
  var st=S.student;var d=(st.week&&st.week[day])||{subjects:[]};var subs=(d.subjects||[]).slice();subs.splice(si,1);
  if(!st.week)st.week={};st.week[day]={subjects:subs};dbSaveSt(st.id,st).then(function(){S.student=st;render();});
}

function addExam(){
  var subject=document.getElementById("eS").value;var date=document.getElementById("eD").value;var topic=document.getElementById("eT").value||"";
  if(!subject||!date){showFlash("Selecione disciplina e data!","#ef4444");return;}
  var st=S.student;if(!st.exams)st.exams=[];st.exams.push({subject:subject,date:date,topic:topic,id:Date.now()});
  dbSaveSt(st.id,st).then(function(){showFlash("Prova adicionada!");S.student=st;render();});
}

function delExam(id){var st=S.student;st.exams=(st.exams||[]).filter(function(e){return e.id!==id;});dbSaveSt(st.id,st).then(function(){S.student=st;render();});}

function tLogin(){var pass=document.getElementById("tPass").value;if(pass===TPASS){loadT();}else{document.getElementById("tErr").style.display="block";document.getElementById("tPass").value="";}}
function loadT(){go("teacher");dbLoad().then(function(data){S.db=data;render();});}
function saveWS(){var ws=document.getElementById("nw").value;if(!ws)return;dbSet("weekStart",ws).then(function(){dbLoad().then(function(data){S.db=data;S.editW=false;render();});});}

function delHistorico(idx){
  if(!confirm('Apagar esta semana do histórico?'))return;
  dbLoad().then(function(data){var hist=data.historico||[];hist.splice(idx,1);db.ref('reforco/historico').set(hist).then(function(){dbLoad().then(function(d){S.db=d;showFlash('Removida!','#ef4444');render();});});});
}

function addNotifAuto(msg){
  dbLoad().then(function(data){var notifs=data.notificacoes||[];notifs.unshift({id:Date.now(),msg:msg,ativa:true,lidas:{},data:today()});if(notifs.length>20)notifs=notifs.slice(0,20);db.ref('reforco/notificacoes').set(notifs).then(function(){dbLoad().then(function(d){S.db=d;render();});});});
}

function resetW(){
  if(!confirm("Reiniciar semana de todos?\n\nOs estudos desta semana serão salvos no histórico antes de limpar."))return;
  dbLoad().then(function(data){
    var hist=data.historico||[];var semData={semana:data.weekStart||today(),data:today(),alunos:{}};
    Object.keys(data.students||{}).forEach(function(id){var st=data.students[id];var dias=0;DAYS.forEach(function(d){if(st.week&&st.week[d]&&st.week[d].subjects&&st.week[d].subjects.length)dias++;});semData.alunos[id]={nome:st.name,grade:st.grade,dias:dias};});
    hist.unshift(semData);if(hist.length>12)hist=hist.slice(0,12);db.ref('reforco/historico').set(hist);
    Object.keys(data.students||{}).forEach(function(id){data.students[id].week={};});
    dbSet("students",data.students).then(function(){S.db=data;showFlash("Semana reiniciada! Histórico salvo ♥");render();});
  });
}

function editStudent(id){
  var data=S.db;if(!data)return;var st=data.students[id];
  var opts=GRADES.map(function(g){return "<option value='"+g+"'"+(st.grade===g?" selected":"")+">"+g+"</option>";}).join("");
  showModal("<div><div style='font-weight:700;font-size:16px;color:#0a2e0f;margin-bottom:14px'>&#9999; Editar Aluno</div><input class='inp' id='editName' value='"+st.name+"' style='margin-bottom:10px'><select class='sel' id='editGrade' style='margin-bottom:14px'>"+opts+"</select><div style='display:flex;gap:10px'><button class='btn btn-green' onclick='confirmEdit(\""+id+"\")'>Salvar</button><button class='btn' style='background:#f0f0f0;color:#555;border:none' onclick='closeModal()'>Cancelar</button></div></div>");
}
function confirmEdit(id){
  var name=document.getElementById("editName").value.trim();var grade=document.getElementById("editGrade").value;
  if(!name||!grade)return;closeModal();
  dbLoad().then(function(data){data.students[id].name=name;data.students[id].grade=grade;dbSaveSt(id,data.students[id]).then(function(){S.db=data;showFlash("Aluno atualizado!");render();});});
}
function deleteStudent(id){
  var data=S.db;if(!data)return;var st=data.students[id];
  if(!confirm("Excluir "+st.name+"?\n\nTodos os dados serão apagados."))return;
  db.ref("reforco/students/"+id).remove().then(function(){dbLoad().then(function(d){S.db=d;S.exp=null;showFlash("Aluno excluído!","#ef4444");render();});});
}

function sendNotif(){
  var titulo=document.getElementById("nTitulo").value.trim();var msg=document.getElementById("nMensagem").value.trim();
  if(!titulo||!msg){showFlash("Preencha título e mensagem!","#ef4444");return;}
  dbLoad().then(function(data){var notifs=(data.notificacoes||[]).slice();notifs.forEach(function(n){n.ativa=false;});notifs.unshift({titulo:titulo,mensagem:msg,ativa:true,data:new Date().toLocaleDateString("pt-BR")});dbSet("notificacoes",notifs).then(function(){S.db=data;S.db.notificacoes=notifs;showFlash("Aviso enviado!");render();});});
}
function toggleNotif(i){dbLoad().then(function(data){var notifs=(data.notificacoes||[]).slice();notifs.forEach(function(n,j){n.ativa=(j===i)?!n.ativa:false;});dbSet("notificacoes",notifs).then(function(){S.db=data;S.db.notificacoes=notifs;render();});});}
function delNotif(i){dbLoad().then(function(data){var notifs=(data.notificacoes||[]).slice();notifs.splice(i,1);dbSet("notificacoes",notifs).then(function(){S.db=data;S.db.notificacoes=notifs;render();});});}

function addFilme(){
  var titulo=document.getElementById("fTitulo").value||"";var genero=document.getElementById("fGenero").value||"";var descricao=document.getElementById("fDesc").value||"";var rep=document.getElementById("fRep").value||"";var imgFile=document.getElementById("fImg").files[0];
  if(!titulo){showFlash("Digite o título!","#ef4444");return;}
  function save(img){dbLoad().then(function(data){if(!data.redacao)data.redacao={filmes:[],dicas:[],tema:{},temas:[]};if(!data.redacao.filmes)data.redacao.filmes=[];data.redacao.filmes.push({titulo:titulo,genero:genero,descricao:descricao,repertorio:rep,img:img,id:Date.now()});dbSet("redacao",data.redacao).then(function(){S.db=data;showFlash("Filme adicionado!");render();});});}
  if(imgFile){if(imgFile.size>800000){showFlash("Imagem muito grande!","#ef4444");return;}var r2=new FileReader();r2.onload=function(e){save(e.target.result);};r2.readAsDataURL(imgFile);}else save("");
}
function delFilme(i){if(!confirm("Remover este filme?"))return;dbLoad().then(function(data){data.redacao.filmes.splice(i,1);dbSet("redacao",data.redacao).then(function(){S.db=data;render();});});}
function addDica(){
  var titulo=document.getElementById("dTitulo").value||"";var conteudo=document.getElementById("dConteudo").value||"";
  if(!titulo||!conteudo){showFlash("Preencha título e conteúdo!","#ef4444");return;}
  dbLoad().then(function(data){if(!data.redacao)data.redacao={filmes:[],dicas:[],tema:{},temas:[]};if(!data.redacao.dicas)data.redacao.dicas=[];data.redacao.dicas.push({titulo:titulo,conteudo:conteudo,id:Date.now()});dbSet("redacao",data.redacao).then(function(){S.db=data;showFlash("Dica adicionada!");render();});});
}
function delDica(i){if(!confirm("Remover esta dica?"))return;dbLoad().then(function(data){data.redacao.dicas.splice(i,1);dbSet("redacao",data.redacao).then(function(){S.db=data;render();});});}

init();
</script>
